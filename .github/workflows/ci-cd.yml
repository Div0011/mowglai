name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Scheduled weekly repository & build audit (every Sunday at 00:00 UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ==========================================
      # CI (Continuous Integration) Pipeline
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}

      - name: Inject Secrets into .htaccess
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          echo "" >> ./out/.htaccess
          echo "# Injected by CI/CD" >> ./out/.htaccess
          if [ -n "$RAZORPAY_KEY_ID" ]; then echo "SetEnv RAZORPAY_KEY_ID $RAZORPAY_KEY_ID" >> ./out/.htaccess; fi
          if [ -n "$RAZORPAY_KEY_SECRET" ]; then echo "SetEnv RAZORPAY_KEY_SECRET $RAZORPAY_KEY_SECRET" >> ./out/.htaccess; fi
          if [ -n "$SMTP_USER" ]; then echo "SetEnv SMTP_USER $SMTP_USER" >> ./out/.htaccess; fi
          if [ -n "$SMTP_PASS" ]; then echo "SetEnv SMTP_PASS $SMTP_PASS" >> ./out/.htaccess; fi
          if [ -n "$DB_HOST" ]; then echo "SetEnv DB_HOST $DB_HOST" >> ./out/.htaccess; fi
          if [ -n "$DB_NAME" ]; then echo "SetEnv DB_NAME $DB_NAME" >> ./out/.htaccess; fi
          if [ -n "$DB_USER" ]; then echo "SetEnv DB_USER $DB_USER" >> ./out/.htaccess; fi
          if [ -n "$DB_PASS" ]; then echo "SetEnv DB_PASS $DB_PASS" >> ./out/.htaccess; fi
        shell: bash

      # ==========================================
      # CD (Continuous Deployment) Pipeline
      # ==========================================
      - name: Deploy directly to Hostinger Document Roots
        # Only deploy on push to main or manual trigger
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          SSH_OPTS="-o StrictHostKeyChecking=no -p $SSH_PORT -i ~/.ssh/deploy_key"
          RSYNC_RSH="ssh -o StrictHostKeyChecking=no -p $SSH_PORT -i ~/.ssh/deploy_key"
          
          echo "=== 1. Checking Hostinger Environment ==="
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "bash -s" << 'EOF'
            echo "SSH login successful! User: $(whoami)"
            mkdir -p /home/u707591712/public_html
            mkdir -p /home/u707591712/domains/mowglai.com/public_html 2>/dev/null || true
          EOF
          
          echo "=== 2. Deploying out/ to /home/u707591712/public_html/ ==="
          rsync -avzr --chmod=D755,F644 -e "$RSYNC_RSH" --exclude '.next' --exclude 'node_modules' --exclude '.git' ./out/ "$SSH_USER@$SSH_HOST:/home/u707591712/public_html/"
          
          echo "=== 3. Deploying out/ to /home/u707591712/domains/mowglai.com/public_html/ ==="
          rsync -avzr --chmod=D755,F644 -e "$RSYNC_RSH" --exclude '.next' --exclude 'node_modules' --exclude '.git' ./out/ "$SSH_USER@$SSH_HOST:/home/u707591712/domains/mowglai.com/public_html/" 2>/dev/null || true
          
          if [ -n "$REMOTE_PATH" ] && [ "$REMOTE_PATH" != "/home/u707591712/public_html" ] && [ "$REMOTE_PATH" != "/home/u707591712/domains/mowglai.com/public_html" ]; then
            echo "=== 4. Deploying out/ to custom REMOTE_PATH: $REMOTE_PATH ==="
            rsync -avzr --chmod=D755,F644 -e "$RSYNC_RSH" --exclude '.next' --exclude 'node_modules' --exclude '.git' ./out/ "$SSH_USER@$SSH_HOST:$REMOTE_PATH/" 2>/dev/null || true
          fi
          
          echo "=== 5. Synchronizing & Verifying Document Roots on Hostinger ==="
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "bash -s" << 'EOF'
            set -e
            echo "--- Synchronizing public_html to domains/mowglai.com/public_html ---"
            mkdir -p /home/u707591712/domains/mowglai.com/public_html
            cp -a /home/u707591712/public_html/. /home/u707591712/domains/mowglai.com/public_html/

            TARGETS=("/home/u707591712/public_html" "/home/u707591712/domains/mowglai.com/public_html")
            for T in "${TARGETS[@]}"; do
              if [ -d "$T" ]; then
                echo "--- Target: $T ---"
                find "$T" -type d -exec chmod 755 {} + 2>/dev/null || true
                find "$T" -type f -exec chmod 644 {} + 2>/dev/null || true
                echo "index.html in $T: $(ls -lh $T/index.html 2>/dev/null || echo 'NOT FOUND')"
                echo ".htaccess in $T: $(ls -lh $T/.htaccess 2>/dev/null || echo 'NOT FOUND')"
              fi
            done

            test -f /home/u707591712/public_html/index.html || { echo "CRITICAL: public_html/index.html missing"; exit 1; }
            test -f /home/u707591712/domains/mowglai.com/public_html/index.html || { echo "CRITICAL: domains/mowglai.com/public_html/index.html missing"; exit 1; }

            echo "=== All Document Roots Verified Successfully! ==="
          EOF
          
          rm -f ~/.ssh/deploy_key
        shell: bash
