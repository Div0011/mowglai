name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Scheduled weekly repository & build audit (every Sunday at 00:00 UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ==========================================
      # CI (Continuous Integration) Pipeline
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}

      - name: Inject Secrets into .htaccess
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          echo "" >> ./out/.htaccess
          echo "# Injected by CI/CD" >> ./out/.htaccess
          if [ -n "$RAZORPAY_KEY_ID" ]; then echo "SetEnv RAZORPAY_KEY_ID $RAZORPAY_KEY_ID" >> ./out/.htaccess; fi
          if [ -n "$RAZORPAY_KEY_SECRET" ]; then echo "SetEnv RAZORPAY_KEY_SECRET $RAZORPAY_KEY_SECRET" >> ./out/.htaccess; fi
          if [ -n "$SMTP_USER" ]; then echo "SetEnv SMTP_USER $SMTP_USER" >> ./out/.htaccess; fi
          if [ -n "$SMTP_PASS" ]; then echo "SetEnv SMTP_PASS $SMTP_PASS" >> ./out/.htaccess; fi
          if [ -n "$DB_HOST" ]; then echo "SetEnv DB_HOST $DB_HOST" >> ./out/.htaccess; fi
          if [ -n "$DB_NAME" ]; then echo "SetEnv DB_NAME $DB_NAME" >> ./out/.htaccess; fi
          if [ -n "$DB_USER" ]; then echo "SetEnv DB_USER $DB_USER" >> ./out/.htaccess; fi
          if [ -n "$DB_PASS" ]; then echo "SetEnv DB_PASS $DB_PASS" >> ./out/.htaccess; fi
        shell: bash

      - name: Upload Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mowglai-production-build
          path: ./out/
          retention-days: 14

      # ==========================================
      # CD (Continuous Deployment) Pipeline
      # ==========================================
      - name: Deploy directly to Hostinger Document Roots
        # Only deploy on push to main or manual trigger
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          # 1. Validate required secrets
          MISSING_SECRETS=""
          if [ -z "$SSH_HOST" ]; then MISSING_SECRETS="${MISSING_SECRETS} SSH_HOST"; fi
          if [ -z "$SSH_USER" ]; then MISSING_SECRETS="${MISSING_SECRETS} SSH_USERNAME"; fi
          if [ -z "$SSH_KEY" ]; then MISSING_SECRETS="${MISSING_SECRETS} SSH_PRIVATE_KEY"; fi
          
          if [ -n "$MISSING_SECRETS" ]; then
            echo "::error::Missing deployment secrets:${MISSING_SECRETS}. Please ensure SSH_HOST, SSH_USERNAME, and SSH_PRIVATE_KEY are added to repository secrets."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          tr -d '\r' < ~/.ssh/deploy_key > ~/.ssh/deploy_key.tmp && mv ~/.ssh/deploy_key.tmp ~/.ssh/deploy_key
          sed -i -e '$a\' ~/.ssh/deploy_key 2>/dev/null || true
          chmod 600 ~/.ssh/deploy_key
          
          PORT="${SSH_PORT:-65002}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT -i ~/.ssh/deploy_key"
          RSYNC_RSH="ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p $PORT -i ~/.ssh/deploy_key"
          USER_HOME="/home/${SSH_USER}"
          
          echo "=== 1. Checking Hostinger Environment & Neutralizing Rogue Processes ==="
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "bash -s" << 'EOF'
            echo "SSH login successful! User: $(whoami), Home: $HOME"
            # Neutralize any unauthorized background processes
            pkill -u $(whoami) -f "virus.sh" 2>/dev/null || true
            pkill -u $(whoami) -f "nohup" 2>/dev/null || true
            pkill -u $(whoami) -f "sleep" 2>/dev/null || true
            # Clean rogue crontabs
            crontab -l 2>/dev/null | grep -v 'virus\.sh' | grep -v 'rogue' | crontab - 2>/dev/null || true
            # Clean up rogue scripts
            rm -f "$HOME/virus.sh" "$HOME"/*.py 2>/dev/null || true
            mkdir -p "$HOME/public_html"
            mkdir -p "$HOME/domains/mowglai.com/public_html" 2>/dev/null || true
          EOF
          
          echo "=== 2. Deploying out/ to $USER_HOME/public_html/ ==="
          rsync -avzr --chmod=D755,F644 -e "$RSYNC_RSH" --exclude '.next' --exclude 'node_modules' --exclude '.git' ./out/ "$SSH_USER@$SSH_HOST:$USER_HOME/public_html/"
          
          echo "=== 3. Deploying out/ to $USER_HOME/domains/mowglai.com/public_html/ ==="
          rsync -avzr --chmod=D755,F644 -e "$RSYNC_RSH" --exclude '.next' --exclude 'node_modules' --exclude '.git' ./out/ "$SSH_USER@$SSH_HOST:$USER_HOME/domains/mowglai.com/public_html/" 2>/dev/null || true
          
          if [ -n "$REMOTE_PATH" ] && [ "$REMOTE_PATH" != "$USER_HOME/public_html" ] && [ "$REMOTE_PATH" != "$USER_HOME/domains/mowglai.com/public_html" ]; then
            echo "=== 4. Deploying out/ to custom REMOTE_PATH: $REMOTE_PATH ==="
            rsync -avzr --chmod=D755,F644 -e "$RSYNC_RSH" --exclude '.next' --exclude 'node_modules' --exclude '.git' ./out/ "$SSH_USER@$SSH_HOST:$REMOTE_PATH/" 2>/dev/null || true
          fi
          
          echo "=== 5. Synchronizing & Verifying Document Roots on Hostinger ==="
          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "bash -s" << 'EOF'
            set -e
            echo "--- Synchronizing public_html to domains/mowglai.com/public_html ---"
            mkdir -p "$HOME/domains/mowglai.com/public_html"
            cp -a "$HOME/public_html/." "$HOME/domains/mowglai.com/public_html/" 2>/dev/null || true

            TARGETS=("$HOME/public_html" "$HOME/domains/mowglai.com/public_html")
            for T in "${TARGETS[@]}"; do
              if [ -d "$T" ]; then
                echo "--- Target: $T ---"
                find "$T" -type d -exec chmod 755 {} + 2>/dev/null || true
                find "$T" -type f -exec chmod 644 {} + 2>/dev/null || true
                echo "index.html in $T: $(ls -lh "$T/index.html" 2>/dev/null || echo 'NOT FOUND')"
                echo ".htaccess in $T: $(ls -lh "$T/.htaccess" 2>/dev/null || echo 'NOT FOUND')"
              fi
            done

            test -f "$HOME/public_html/index.html" || { echo "CRITICAL: public_html/index.html missing"; exit 1; }
            test -f "$HOME/domains/mowglai.com/public_html/index.html" || { echo "CRITICAL: domains/mowglai.com/public_html/index.html missing"; exit 1; }

            echo "=== All Document Roots Verified Successfully! ==="
          EOF
          
          rm -f ~/.ssh/deploy_key
        shell: bash
