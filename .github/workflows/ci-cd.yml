name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build static export
        run: npm run export
        env:
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}

      - name: Verify local export
        run: |
          test -s ./out/index.html
          if grep -qiE "you'?ve been hacked|defaced" ./out/index.html; then
            echo "::error::Build output contains defacement markers."
            exit 1
          fi

      - name: Validate deployment configuration
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.repository_owner == '1nsharma'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          set -euo pipefail
          for name in SSH_PRIVATE_KEY SSH_HOST SSH_USERNAME SSH_PORT REMOTE_PATH DB_NAME DB_USER DB_PASS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required deployment configuration is missing: $name"
              exit 1
            fi
          done

      - name: Inject server configuration into export
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.repository_owner == '1nsharma'
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "# Generated by GitHub Actions. Keep this file private on the server."
            [ -z "${RAZORPAY_KEY_ID:-}" ] || echo "SetEnv RAZORPAY_KEY_ID $RAZORPAY_KEY_ID"
            [ -z "${RAZORPAY_KEY_SECRET:-}" ] || echo "SetEnv RAZORPAY_KEY_SECRET $RAZORPAY_KEY_SECRET"
            echo "SetEnv DB_HOST ${DB_HOST:-localhost}"
            echo "SetEnv DB_NAME $DB_NAME"
            echo "SetEnv DB_USER $DB_USER"
            echo "SetEnv DB_PASS $DB_PASS"
          } >> ./out/.htaccess

      - name: Sync files to Hostinger via SSH
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.repository_owner == '1nsharma'
        uses: burnett01/rsync-deployments@8.0.4
        with:
          switches: "-avzr --exclude '.next' --exclude 'node_modules' --exclude '.git'"
          path: ./out/
          remote_path: ${{ secrets.REMOTE_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Verify deployed homepage
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.repository_owner == '1nsharma'
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --silent --show-error --location --fail --max-time 20 --output /tmp/mowglai-home.html --write-out '%{http_code}' https://mowglai.com/)"
          case "$HTTP_CODE" in
            2??) ;;
            *) echo "::error::Unexpected homepage HTTP status: $HTTP_CODE"; exit 1 ;;
          esac
          grep -qi '<title>.*Mowglai' /tmp/mowglai-home.html
          if grep -qiE "you'?ve been hacked|defaced" /tmp/mowglai-home.html; then
            echo "::error::Live homepage contains a defacement marker."
            exit 1
          fi
          echo "Live homepage returned HTTP $HTTP_CODE and passed integrity checks."
