name: Remove Virus Script & Secure Site

on:
  workflow_dispatch:

jobs:
  remove-virus:
    runs-on: ubuntu-latest
    steps:
      - name: Remove virus.sh and sync files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-o StrictHostKeyChecking=no -p $SSH_PORT -i ~/.ssh/deploy_key"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "bash -s" << 'EOF'
            set -e
            echo "--- Removing virus.sh ---"
            rm -f /home/u707591712/virus.sh
            [ ! -f /home/u707591712/virus.sh ] && echo "SUCCESS: virus.sh is DELETED!"

            echo "--- Copying all 1005 files from public_html to domains/mowglai.com/public_html ---"
            cp -a /home/u707591712/public_html/. /home/u707591712/domains/mowglai.com/public_html/

            echo "--- Setting permissions ---"
            find /home/u707591712/domains/mowglai.com/public_html/ -type d -exec chmod 755 {} +
            find /home/u707591712/domains/mowglai.com/public_html/ -type f -exec chmod 644 {} +

            echo "--- Verifying index.html ---"
            ls -la /home/u707591712/domains/mowglai.com/public_html/index.html
            echo "Total files: $(find /home/u707591712/domains/mowglai.com/public_html/ -type f | wc -l)"
          EOF

          echo "--- Probing site ---"
          sleep 3
          curl -s -o /dev/null -w "Final HTTP Code: %{http_code}\n" "https://mowglai.com"
          curl -s -o /dev/null -w "index.html HTTP Code: %{http_code}\n" "https://mowglai.com/index.html"

          rm -f ~/.ssh/deploy_key
